<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Модель в AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #f3f5f1; --fg: #1f2a22; --muted: #5d6b60; --accent: #2f6f4e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141a16; --fg: #e6ece6; --muted: #9aa89d; --accent: #3f8f66; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header a { color: var(--fg); }
  model-viewer { flex: 1; width: 100%; background: transparent; }
  .ar-btn { position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 16px; border: 0; border-radius: 10px;
            background: var(--accent); color: #fff; font: 600 18px system-ui, sans-serif; }
  #status { padding: 0 16px 12px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header><strong id="title">Модель</strong><a href="./">← Назад</a></header>
<model-viewer id="mv" ar ar-modes="webxr scene-viewer" ar-scale="fixed" ar-placement="floor"
              camera-controls shadow-intensity="1" alt="3D-модель постройки">
  <button slot="ar-button" class="ar-btn">Смотреть на участке</button>
</model-viewer>
<p id="status">Можно покрутить модель пальцем. Для AR нажмите кнопку внизу.</p>
<script>
  // Only the two published models are allowed, so the page cannot be pointed at arbitrary files.
  const MODELS = { masterskaya: 'Мастерская', naves: 'Навес' };
  const key = new URLSearchParams(location.search).get('m');
  const name = key in MODELS ? key : 'masterskaya';
  const mv = document.getElementById('mv'), status = document.getElementById('status');
  document.getElementById('title').textContent = MODELS[name];
  mv.src = name + '.glb';
  mv.addEventListener('ar-status', (e) => {
    if (e.detail.status === 'failed') status.textContent = 'AR не запустился на этом телефоне. Попробуйте другой способ на главной странице.';
  });
  mv.addEventListener('load', () => {
    if (!mv.canActivateAR) status.textContent = 'Браузер не видит поддержки AR на этом телефоне. Модель можно покрутить в 3D.';
  });
</script>
</body>
</html>
